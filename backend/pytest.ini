[pytest]
testpaths = tests
addopts =
    -q
    --cov=app
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-fail-under=80

# Coverage scoping rationale (mirrors frontend/web/vitest.config.ts):
# The 80% gate is enforced over app/ minus the static domain data packages under
# app/domains/* (question banks, scoring dimensions, registry lookup tables —
# low-risk data, not worth testing) — see .coveragerc. Everything else in app/
# — API routes, auth, db CRUD, services — must be covered at >=80%.