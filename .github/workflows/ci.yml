name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend API tests + coverage gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r ../requirements.txt
          pip install pytest pytest-cov
      - name: Run suite (80% coverage gate, dev DB untouched)
        run: pytest

  core:
    name: Core unit tests + mutation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run core suite
        run: >
          pytest
          test_core.py test_analytics.py test_question_engine.py
          test_interview_runner.py test_resume.py test_evaluator.py
          test_mutation_kills.py tests/test_api.py -p no:cacheprovider

  frontend:
    name: Frontend (Vitest, typecheck, build, Playwright E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests, typecheck, production build
        run: npm run verify
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E (fake-device voice)
        run: npm run e2e